services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: application_backend
    ports:
      - "8000:8000"
#    env_file:
#      - .env
    volumes:
      - .:/backend
    working_dir: /backend




  frontend:
   build: ./frontend
   ports:
     - "3000:3000"
   volumes:
     - ./frontend:/app
     - /app/node_modules
   environment:
     - CHOKIDAR_USEPOLLING=true
   depends_on:
     - app

